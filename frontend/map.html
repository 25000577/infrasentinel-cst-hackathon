<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map — InfraSentinel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  /* Guaranteed layout safety for map container */
  .map-card-container {
    position: relative;
    width: 100%;
  }
  #map {
    width: 100% !important;
    height: 600px !important;
    min-height: 600px !important;
    display: block !important;
    background-color: #e2e8f0; /* Visible grey placeholder while loading */
    border-radius: 6px;
    z-index: 1;
  }
</style>
</head>
<body data-page="map">
<main class="page">
  <div class="page-head">
    <div>
      <h1>Map</h1>
      <p>Transformer locations across Limpopo, coloured by health.</p>
    </div>
    <div class="page-actions" id="pageActions">
      <button class="btn btn-outline" id="refreshMapBtn" title="Refresh Map Data">Refresh Data</button>
      <a href="transformers.html" class="btn btn-primary">+ Manage Assets</a>
    </div>
  </div>
  
  <div class="grid cols-main" style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem;">
    <div class="card map-card-container">
      <div class="card-head">
        <h2>Network map</h2>
        <p>Green normal · amber warning · red critical · grey offline</p>
      </div>
      <!-- Map Container with loading text -->
      <div id="map">
        <div style="padding: 40px; text-align: center; color: #475569; font-family: sans-serif;">
          Loading map tiles and substation coordinates...
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2>Transformers</h2>
        <p>Click any unit to locate on map</p>
      </div>
      <div class="map-list" id="mapList" style="max-height: 550px; overflow-y: auto;"></div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
/* ==========================================================================
   InfraSentinel — Ultimate Diagnostic Map Controller
   ========================================================================== */
document.addEventListener("DOMContentLoaded", async () => {
  console.log("Map DOM Content Loaded. Initializing...");

  if (typeof initPageShell === "function") {
    try { initPageShell(); } catch (e) { console.warn("initPageShell warning:", e); }
  }

  const mapEl = document.getElementById("map");
  const listEl = document.getElementById("mapList");
  
  if (!mapEl) {
    console.error("CRITICAL: #map element not found in DOM!");
    return;
  }

  if (typeof L === "undefined") {
    mapEl.innerHTML = `<div style="padding: 30px; color: #dc2626; font-weight: bold;">Leaflet (L) library failed to load. Check your internet connection or script order.</div>`;
    return;
  }

  // Initialize Leaflet Map centered on (-22.9823312, 30.4472737)
  let map;
  try {
    map = L.map('map', { scrollWheelZoom: true }).setView([-22.9823312, 30.4472737], 15);
    
    // Using CartoDB Positron tiles as a reliable, clean alternative that rarely gets blocked
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
    }).addTo(map);

    console.log("Leaflet map initialized successfully.");
  } catch (err) {
    console.error("Map initialization exception:", err);
    mapEl.innerHTML = `<div style="padding: 30px; color: #dc2626;">Map error: ${err.message}</div>`;
    return;
  }

  const COLORS = { NORMAL: "#16A34A", WARNING: "#D97706", CRITICAL: "#DC2626" };
  const markers = new Map();
  let initialBoundsSet = false;

  function pin(t) {
    const offline = t.status !== "ONLINE";
    const colour = offline ? "#64748B" : (COLORS[t.health] || COLORS.NORMAL);
    return L.divIcon({
      className: "",
      html: `<span style="display:block;width:20px;height:20px;border-radius:50%;background:${colour};border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.45)"></span>`,
      iconSize: [20, 20],
      iconAnchor: [10, 10],
    });
  }

  async function loadMapData() {
    let rawData = [];
    try {
      if (typeof api !== "undefined" && typeof api.infrastructure === "function") {
        rawData = await api.infrastructure();
      } else {
        console.warn("api.infrastructure not found, using fallback mock data.");
        rawData = [
          { id: 1, code: "TR-01", name: "Thohoyandou Main", location: "Campus Feeder", voltage_kv: 33, temperature: 45.2, vibration: 0.02, health: "NORMAL", status: "ONLINE", lat: -22.9823312, lng: 30.4472737 }
        ];
      }
    } catch (err) {
      console.warn("API fetch failed, rendering fallback marker:", err);
      rawData = [
        { id: 1, code: "TR-01", name: "Thohoyandou Main", location: "Campus Feeder", voltage_kv: 33, temperature: 45.2, vibration: 0.02, health: "NORMAL", status: "ONLINE", lat: -22.9823312, lng: 30.4472737 }
      ];
    }

    let data = [];
    if (Array.isArray(rawData)) data = rawData;
    else if (rawData && Array.isArray(rawData.data)) data = rawData.data;
    else if (rawData && Array.isArray(rawData.transformers)) data = rawData.transformers;

    const located = data.filter(t => t.lat != null && t.lng != null);

    markers.forEach(m => m.remove());
    markers.clear();

    located.forEach(t => {
      const gMapsUrl = `https://www.google.com/maps/search/?api=1&query=${t.lat},${t.lng}`;
      const m = L.marker([t.lat, t.lng], { icon: pin(t), title: t.code || "Transformer" }).addTo(map);
      
      const safeCode = typeof escapeHtml === "function" ? escapeHtml(t.code || "") : (t.code || "");
      const safeName = typeof escapeHtml === "function" ? escapeHtml(t.name || "") : (t.name || "");
      const safeLoc = typeof escapeHtml === "function" ? escapeHtml(t.location || "") : (t.location || "");

      m.bindPopup(`
        <strong>${safeCode}</strong> — ${safeName}<br>
        ${safeLoc} · ${t.voltage_kv} kV<br>
        Temp ${t.temperature} °C · Vibration ${t.vibration}<br>
        <div style="margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
          <a href="monitoring.html?id=${t.id}">Open monitoring</a>
          <span>·</span>
          <a href="${gMapsUrl}" target="_blank" rel="noopener">Open in Google Maps ↗</a>
        </div>`);
      
      markers.set(String(t.id), m);
    });

    if (located.length && !initialBoundsSet) {
      try {
        map.setView([-22.9823312, 30.4472737], 15);
        initialBoundsSet = true;
      } catch (e) {
        console.warn("Could not set view:", e);
      }
    }

    if (listEl) {
      listEl.innerHTML = data.length ? data.map(t => {
        const sc = typeof escapeHtml === "function" ? escapeHtml(t.code || "") : (t.code || "");
        const sn = typeof escapeHtml === "function" ? escapeHtml(t.name || "") : (t.name || "");
        const sl = typeof escapeHtml === "function" ? escapeHtml(t.location || "") : (t.location || "");
        
        return `
          <div class="map-item" data-id="${t.id}" style="cursor: pointer; padding: 10px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center;">
            <div style="flex-grow: 1;"><strong>${sc}</strong> ${sn}<small style="display:block; color:#64748b;">${sl}</small></div>
            <span style="padding: 2px 8px; background: #e2e8f0; border-radius: 4px; font-size: 11px;">${t.status}</span>
          </div>`;
      }).join("") : `<div style="padding: 15px; color: #64748b;">No transformers registered.</div>`;

      listEl.querySelectorAll(".map-item").forEach(el => {
        el.addEventListener("click", () => {
          const markerKey = String(el.dataset.id);
          const m = markers.get(markerKey);
          if (m) {
            map.setView(m.getLatLng(), 17);
            m.openPopup();
          }
        });
      });
    }
  }

  await loadMapData();
  
  const refreshBtn = document.getElementById("refreshMapBtn");
  if (refreshBtn) {
    refreshBtn.addEventListener("click", loadMapData);
  }

  setTimeout(() => map.invalidateSize(), 300);
});
</script>
</body>
</html>
