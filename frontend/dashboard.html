<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — InfraSentinel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

</head>
<body data-page="dashboard">
<main class="page">
  <div class="page-head">
    <div><h1>Dashboard</h1><p>Live status of the transformer network and recent security activity.</p></div>
    <div class="page-actions" id="pageActions"><a class="btn btn-outline" href="simulation.html">Open simulation lab</a></div>
  </div>
  <div class="stat-grid" id="statCards"></div>
  <div class="grid cols-1">
    <div class="card"><div class="card-head"><h2>Alerts by severity</h2></div><div class="chart-box"><canvas id="severityChart"></canvas></div></div>
  </div>
  <div class="card">
    <div class="card-head"><h2>Infrastructure</h2><a href="transformers.html">Manage transformers</a></div>
    <div class="table-wrap"><table id="infraTable"><thead><tr><th>Code</th><th>Name</th><th>Location</th><th class="num">Voltage (V)</th><th class="num">Current (A)</th><th>Connectivity</th><th>Health</th></tr></thead><tbody></tbody></table></div>
  </div>
  <div class="card">
    <div class="card-head"><h2>Recent electrical activity</h2><a href="threats.html">View all threats</a></div>
    <div class="table-wrap"><table id="activityTable"><thead><tr><th>Event</th><th>Transformer</th><th>Severity</th><th>Time</th><th>Status</th></tr></thead><tbody></tbody></table></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
